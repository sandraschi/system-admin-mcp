# CI/CD Workflow - system-admin-mcp
# Fleet five-gate shape: ruff + biome style, pyright + tsc types, pytest behavior.

name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check src/

      - name: Ruff format check
        run: uv run ruff format --check src/

        - name: Pyright typecheck
          run: uv run pyright src/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: web_sota
        run: npm ci

      - name: TypeScript check
        working-directory: web_sota
        run: npx tsc --noEmit

      - name: Biome check
        working-directory: web_sota
        run: npx biome ci src/

  test:
    name: Test with pytest
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        run: |
          uv run python -m pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -q \
            --maxfail=10 \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build package
    runs-on: windows-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
